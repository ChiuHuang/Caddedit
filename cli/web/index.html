<!doctype html>
<html lang="en" class="mdui-theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caddedit</title>
<link rel="stylesheet" href="/vendor/mdui/mdui.css">
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; background: rgb(var(--mdui-color-background)); }
  main { max-width: 60rem; margin: 0 auto; padding: 1rem 1rem 6rem; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; }
  .route-card {
    display: flex; align-items: center; gap: 1rem;
    background: rgb(var(--mdui-color-surface-container));
    border-radius: var(--mdui-shape-corner-large);
    padding: 0.75rem 1rem; margin-bottom: 0.75rem;
  }
  .route-main { flex: 1; min-width: 0; }
  .route-domains { font-weight: 600; overflow-wrap: anywhere; }
  .route-meta { color: rgb(var(--mdui-color-on-surface-variant)); font-size: 0.85rem; margin-top: 0.15rem; }
  .route-actions { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; }
  #toolbar { display: flex; gap: 0.25rem; align-items: center; }
  #empty { text-align: center; color: rgb(var(--mdui-color-on-surface-variant)); padding: 4rem 0; }
  .editor-field textarea { min-height: 44vh; }
  .edit-grid { display: flex; gap: 1.25rem; flex-wrap: wrap; }
  .edit-raw { flex: 1.5; min-width: 22rem; }
  .edit-parsed {
    flex: 1; min-width: 15rem;
    background: rgb(var(--mdui-color-surface-container));
    border-radius: var(--mdui-shape-corner-medium);
    padding: 1rem;
  }
  .parsed-row { margin-bottom: 0.65rem; font-size: 0.85rem; line-height: 1.45; }
  .parsed-row b { display: block; opacity: 0.6; font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .chip {
    display: inline-block; padding: 0.1rem 0.6rem; border-radius: 999px;
    background: rgb(var(--mdui-color-secondary-container));
    color: rgb(var(--mdui-color-on-secondary-container));
    font-size: 0.75rem;
  }
  .swatch {
    width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; outline: none; padding: 0;
  }
  .swatch.active { border-color: rgb(var(--mdui-color-on-surface)); }
</style>
</head>
<body>

<mdui-top-app-bar variant="fixed">
  <mdui-top-app-bar-title style="display:flex;align-items:center;gap:.5rem;">
    Caddedit
    <span id="config-path" class="mono" style="font-size:.75rem;color:rgb(var(--mdui-color-on-surface-variant));"></span>
  </mdui-top-app-bar-title>
  <div id="toolbar" slot="right-side">
    <mdui-button variant="text" id="btn-refresh">Refresh</mdui-button>
    <mdui-button variant="text" id="btn-reload">Reload Caddy</mdui-button>
    <mdui-tooltip content="Quick theme switch">
      <mdui-button-icon id="btn-theme"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2a1 1 0 1 0 0-2H2a1 1 0 1 0 0 2zm18 0h2a1 1 0 1 0 0-2h-2a1 1 0 1 0 0 2zM11 2v2a1 1 0 1 0 2 0V2a1 1 0 1 0-2 0zm0 18v2a1 1 0 1 0 2 0v-2a1 1 0 1 0-2 0zM5.99 4.58a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 1 0 1.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 1 0 1.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 1 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 1 0 1.41 1.41l1.06-1.06z"/></svg></mdui-button-icon>
    </mdui-tooltip>
    <mdui-tooltip content="Settings">
      <mdui-button-icon id="btn-settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></mdui-button-icon>
    </mdui-tooltip>
    <mdui-tooltip content="Logout">
      <mdui-button-icon id="btn-logout"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M17 8l-1.41 1.41L17.17 11H9v2h8.17l-1.58 1.59L17 16l4-4zM5 5h6V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6v-2H5V5z"/></svg></mdui-button-icon>
    </mdui-tooltip>
  </div>
</mdui-top-app-bar>

<main>
  <mdui-text-field id="search" variant="outlined" placeholder="Search domain, upstream, tls…" clearable
    autocomplete="off" spellcheck="false" style="margin-bottom:1rem;"></mdui-text-field>
  <div id="routes"></div>
  <div id="empty" hidden>No routes yet.</div>
</main>

<mdui-fab id="fab-new" icon="add" style="position:fixed;right:1.5rem;bottom:1.5rem;">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" slot="icon"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
</mdui-fab>

<!-- edit dialog: raw source + parsed summary side by side -->
<mdui-dialog id="dlg-edit" class="editor-dialog" close-on-overlay-click style="--dialog-max-width:64rem;width:64rem;">
  <span slot="headline">Edit <span id="edit-id" class="mono"></span></span>
  <div class="edit-grid">
    <div class="edit-raw">
      <mdui-text-field id="edit-content" class="mono editor-field" variant="outlined" autocomplete="off"
        spellcheck="false" autosize min-rows="16" max-rows="30"></mdui-text-field>
      <div id="edit-error" style="color:rgb(var(--mdui-color-error));white-space:pre-wrap;font-size:.85rem;margin-top:.5rem;"></div>
    </div>
    <aside class="edit-parsed">
      <h3 style="margin:.25rem 0 .75rem;font-weight:600;">Parsed</h3>
      <div id="parsed-body" class="mono"></div>
    </aside>
  </div>
  <mdui-button slot="action" variant="text" id="edit-cancel">Cancel</mdui-button>
  <mdui-button slot="action" variant="filled" id="edit-save" loading>Save</mdui-button>
</mdui-dialog>

<!-- settings dialog -->
<mdui-dialog id="dlg-settings" close-on-overlay-click style="min-width:24rem;">
  <span slot="headline">Settings</span>
  <div style="display:flex;flex-direction:column;gap:1.5rem;">
    <div>
      <div style="font-weight:500;margin-bottom:.5rem;">Theme</div>
      <mdui-segmented-button-group id="set-theme" selects="single">
        <mdui-segmented-button value="light">Light</mdui-segmented-button>
        <mdui-segmented-button value="dark">Dark</mdui-segmented-button>
        <mdui-segmented-button value="auto">Auto</mdui-segmented-button>
      </mdui-segmented-button-group>
    </div>
    <div>
      <div style="font-weight:500;margin-bottom:.5rem;">Accent color</div>
      <div id="swatches" style="display:flex;gap:.75rem;"></div>
    </div>
  </div>
  <mdui-button slot="action" variant="filled" id="settings-done">Done</mdui-button>
</mdui-dialog>

<!-- new route dialog -->
<mdui-dialog id="dlg-new" close-on-overlay-click>
  <span slot="headline">New route</span>
  <div style="display:flex;flex-direction:column;gap:1rem;min-width:24rem;">
    <mdui-text-field id="new-domains" variant="outlined" label="Domains (comma separated)" placeholder="app.example.com" autocomplete="off" spellcheck="false"></mdui-text-field>
    <mdui-text-field id="new-upstream" variant="outlined" label="Upstream" placeholder="localhost:3000" autocomplete="off" spellcheck="false"></mdui-text-field>
    <mdui-select id="new-tls" variant="outlined" label="TLS">
      <mdui-menu-item value="none">none (HTTP only)</mdui-menu-item>
      <mdui-menu-item value="internal" selected>automatic / Let's Encrypt</mdui-menu-item>
      <mdui-menu-item value="internal_explicit">tls internal</mdui-menu-item>
      <mdui-menu-item value="cloudflare">Cloudflare DNS challenge</mdui-menu-item>
    </mdui-select>
    <mdui-checkbox id="new-watch-log">import request_watch_log</mdui-checkbox>
    <div id="new-error" style="color:rgb(var(--mdui-color-error));white-space:pre-wrap;font-size:.85rem;"></div>
  </div>
  <mdui-button slot="action" variant="text" id="new-cancel">Cancel</mdui-button>
  <mdui-button slot="action" variant="filled" id="new-create">Create</mdui-button>
</mdui-dialog>

<!-- login dialog -->
<mdui-dialog id="dlg-login" close-on-overlay-click="false" style="min-width:22rem;">
  <span slot="headline">Caddedit</span>
  <div style="display:flex;flex-direction:column;gap:1rem;">
    <mdui-text-field id="login-password" type="password" variant="outlined" label="Password" toggle-password
      autocomplete="current-password"></mdui-text-field>
    <div id="login-error" style="color:rgb(var(--mdui-color-error));font-size:.85rem;"></div>
  </div>
  <mdui-button slot="action" variant="filled" id="login-go">Unlock</mdui-button>
</mdui-dialog>

<script src="/vendor/mdui/mdui.global.js"></script>
<script src="/app.js"></script>
</body>
</html>

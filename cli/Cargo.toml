[package]
name = "caddedit-cli"
version = "0.5.6"
edition = "2021"
description = "Split, inspect and toggle Caddy site blocks without pain"
license = "MIT"

# install as `caddedit` everywhere, not `caddedit-cli`
[[bin]]
name = "caddedit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
crossterm = "0.28"
ratatui = "0.29"
getrandom = "0.3"
mime_guess = "2"
owo-colors = "4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
